[project]
name = "juxtapose"
version = "0.1.0"
description = "Config-driven A/B evaluation survey for research studies"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "flask-limiter>=3.8.0",
    "flask-wtf>=1.2.0",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey"]
