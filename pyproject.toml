[project]
name = "juxtapose"
version = "0.1.0"
description = "Config-driven A/B evaluation survey for research studies"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Upper bounds, not pins: pip resolves fresh every CI run, and a study mid-collection must not inherit a new major's cookie, session or rate-limit behaviour.
    "flask>=3.0.0,<4",
    "gunicorn>=21.2.0,<27",
    "flask-limiter>=3.8.0,<5",
    "redis>=5.0.0,<9",
    "flask-wtf>=1.2.0,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-cov>=5.0.0,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey"]
