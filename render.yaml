services:
  - type: web
    name: survey-app
    env: python
    buildCommand: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      uv sync
    startCommand: |
      export PATH="$HOME/.local/bin:$PATH"
      uv run gunicorn src.survey.app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: REFERRAL_CODES
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

