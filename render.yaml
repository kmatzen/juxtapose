services:
  - type: web
    name: survey-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.survey.app:app
    # Persistent disk to keep database across restarts (requires paid plan)
    disk:
      name: survey-data
      mountPath: /opt/render/project/src
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: REFERRAL_CODES
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

