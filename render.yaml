services:
  - type: web
    name: survey-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.survey.app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: REFERRAL_CODES
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

