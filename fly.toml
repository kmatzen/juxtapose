# fly.toml app configuration file generated for survey-app-silent-frost-2723 on 2025-11-12T22:56:54-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'survey-app-silent-frost-2723'
primary_region = 'sjc'

[build]
  # Use Dockerfile for lighter build process
  dockerfile = "Dockerfile"

[deploy]
  strategy = 'bluegreen'

[env]
  DATABASE_PATH = '/data/survey.db'
  PORT = '8000'
  PYTHON_VERSION = '3.11'

[[mounts]]
  source = 'survey_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  
[compute]
  size = 'shared-cpu-1x'  # Explicitly use free tier machine size
