# Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/ for details

app = "survey-app"  # Change this to your app name
primary_region = "sjc"  # San Jose, CA - change to region closest to you

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8000"
  PYTHON_VERSION = "3.11"
  # Database will be stored on persistent volume at /data
  DATABASE_PATH = "/data/survey.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # Scale to zero when idle (free tier)
  
  [[http_service.machines]]
    cpu_kind = "shared"
    cpus = 1
    memory_mb = 256

# Persistent volume for database (3GB free)
[mounts]
  source = "survey_data"
  destination = "/data"

# Health check
[[services.http_checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/"

# Deployment settings
[deploy]
  strategy = "immediate"
