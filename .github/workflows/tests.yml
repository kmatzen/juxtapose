name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      # pytest.ini forces --cov; the CI gate is pass/fail, coverage is a local command.
      # TEMPORARY DEBUG (#75): the token used to review this PR has no actions:read, so the failure is
      # published as a check-run annotation, which the API does expose. Revert before merge.
      - run: |
          python -m pytest tests -q --no-cov 2>&1 | tee /tmp/pytest.log || {
            echo "::error::failing lines: $(grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -8 | tr '\n' ';')"
            echo "::error::tail: $(tail -45 /tmp/pytest.log | tr '\n' ';' | tr '"' "'")"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            test-results
            playwright-report
