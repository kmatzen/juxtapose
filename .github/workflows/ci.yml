name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run jest
        run: npm test

  screenshots:
    name: UI screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and Playwright
        run: |
          pip install -e .
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start the app
        env:
          DEV_MODE: "true"
        run: |
          gunicorn src.survey.app:app --bind 127.0.0.1:5000 --workers 1 &
          echo $! > app.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health >/dev/null; then
              echo "app is up"; break
            fi
            sleep 1
          done
      - name: Capture screenshots
        env:
          BASE_URL: "http://127.0.0.1:5000"
          ADMIN_PASSWORD: "admin123"
        run: python scripts/screenshots.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: warn
      - name: Stop the app
        if: always()
        run: kill "$(cat app.pid)" || true
