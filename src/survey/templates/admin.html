<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="admin-container">
        <h1>Survey Administration</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-responses">0</div>
                <div class="stat-label">Total Responses</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="a-preferred">0</div>
                <div class="stat-label">Prefer Image A</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="b-preferred">0</div>
                <div class="stat-label">Prefer Image B</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avg-confidence" style="font-size: 1.5em;">0 / 0</div>
                <div class="stat-label">Avg Confidence (Image / Prompt)</div>
            </div>
        </div>

        <button class="btn btn-primary export-btn" onclick="exportCSV()">Export to CSV</button>

        <button class="btn btn-primary" onclick="location.href='/admin/logout'" style="margin-bottom: 10px;">Logout</button>

        <div style="margin-bottom: 20px;">
            <button class="btn btn-primary" onclick="toggleView()">Toggle View</button>
            <span id="view-mode" style="margin-left: 10px; font-weight: 600;">Demographics View</span>
        </div>

        <table id="results-table">
            <thead id="table-header">
                <!-- Will be populated by JavaScript -->
            </thead>
            <tbody id="results-body">
                <tr><td colspan="15">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let currentView = 'demographics'; // 'demographics' or 'responses'
        let cachedData = [];

        async function loadResults() {
            try {
                const response = await fetch('/api/admin/results');
                const data = await response.json();
                cachedData = data;
                
                // Update stats
                const uniqueParticipants = new Set(data.map(r => r.email)).size;
                document.getElementById('total-responses').textContent = uniqueParticipants;
                
                const aCount = data.filter(r => r.better_image === 'A').length;
                const bCount = data.filter(r => r.better_image === 'B').length;
                const avgImageConf = data.length > 0 
                    ? (data.reduce((sum, r) => sum + (r.image_confidence || 0), 0) / data.length).toFixed(1)
                    : 0;
                const avgPromptConf = data.length > 0 
                    ? (data.reduce((sum, r) => sum + (r.prompt_confidence || 0), 0) / data.length).toFixed(1)
                    : 0;
                
                document.getElementById('a-preferred').textContent = aCount;
                document.getElementById('b-preferred').textContent = bCount;
                document.getElementById('avg-confidence').textContent = avgImageConf + ' / ' + avgPromptConf;
                
                // Render current view
                renderTable();
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('results-body').innerHTML = 
                    '<tr><td colspan="15">Error loading results</td></tr>';
            }
        }

        function toggleView() {
            currentView = currentView === 'demographics' ? 'responses' : 'demographics';
            document.getElementById('view-mode').textContent = 
                currentView === 'demographics' ? 'Demographics View' : 'Responses View';
            renderTable();
        }

        function renderTable() {
            const thead = document.getElementById('table-header');
            const tbody = document.getElementById('results-body');
            
            if (cachedData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="15">No responses yet</td></tr>';
                return;
            }

            if (currentView === 'demographics') {
                // Demographics view - one row per participant
                thead.innerHTML = `
                    <tr>
                        <th>Email</th>
                        <th>Browser</th>
                        <th>OS</th>
                        <th>Screen</th>
                        <th>DPR</th>
                        <th>Occupation</th>
                        <th>Tech Level</th>
                        <th>Used Image Gen</th>
                        <th>AI Familiarity</th>
                        <th>Responses</th>
                    </tr>
                `;
                
                // Group by email
                const participantMap = {};
                cachedData.forEach(row => {
                    if (!participantMap[row.email]) {
                        participantMap[row.email] = {
                            email: row.email,
                            browser: row.browser,
                            browser_version: row.browser_version,
                            os: row.os,
                            screen_width: row.screen_width,
                            screen_height: row.screen_height,
                            pixel_ratio: row.pixel_ratio,
                            occupation: row.occupation,
                            technical_background: row.technical_background,
                            has_used_image_gen: row.has_used_image_gen,
                            ai_familiarity: row.ai_familiarity,
                            responseCount: 0
                        };
                    }
                    participantMap[row.email].responseCount++;
                });
                
                tbody.innerHTML = Object.values(participantMap).map(p => `
                    <tr>
                        <td>${p.email || '-'}</td>
                        <td style="font-size: 11px;">${p.browser || '-'} ${p.browser_version || ''}</td>
                        <td>${p.os || '-'}</td>
                        <td style="font-size: 11px;">${p.screen_width}×${p.screen_height}</td>
                        <td>${p.pixel_ratio ? p.pixel_ratio + 'x' : '-'}</td>
                        <td>${p.occupation || '-'}</td>
                        <td>${p.technical_background || '-'}</td>
                        <td>${p.has_used_image_gen || '-'}</td>
                        <td>${p.ai_familiarity || '-'}</td>
                        <td><strong>${p.responseCount}/30</strong></td>
                    </tr>
                `).join('');
            } else {
                // Responses view - one row per response
                thead.innerHTML = `
                    <tr>
                        <th>Date</th>
                        <th>Email</th>
                        <th>Pair#</th>
                        <th>Better Image</th>
                        <th>Img Conf</th>
                        <th>Better Match</th>
                        <th>Prompt Conf</th>
                        <th>Randomized</th>
                    </tr>
                `;
                
                tbody.innerHTML = cachedData.map(row => `
                    <tr>
                        <td>${new Date(row.response_created).toLocaleDateString()}</td>
                        <td>${row.email || '-'}</td>
                        <td>${row.image_pair_id || '-'}</td>
                        <td>${row.better_image || '-'}</td>
                        <td>${row.image_confidence || '-'}</td>
                        <td>${row.better_prompt_match || '-'}</td>
                        <td>${row.prompt_confidence || '-'}</td>
                        <td>${row.was_randomized ? 'Yes' : 'No'}</td>
                    </tr>
                `).join('');
            }
        }

        function exportCSV() {
            window.location.href = '/api/admin/export';
        }

        // Load results on page load
        loadResults();
        
        // Refresh every 30 seconds
        setInterval(loadResults, 30000);
    </script>
    
    <footer class="survey-footer">
        <p>Survey administration | Issues? <a href="mailto:survey-x7qp@adobe.com">survey-x7qp@adobe.com</a></p>
    </footer>
</body>
</html>
